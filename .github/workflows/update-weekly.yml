name: Update carburantscorse2 weekly

on:
  schedule:
    # Two UTC slots cover 08:07 Europe/Paris across DST; the gate below keeps only one.
    - cron: '7 6 * * 1'
    - cron: '7 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carburantscorse2-weekly
  cancel-in-progress: false

env:
  PYTHONPATH: .
  C1_V2_TAG_PREFIX: a4c-v2-shared-

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Select the 08:07 Europe/Paris slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              run = True
          else:
              paris = datetime.now(ZoneInfo('Europe/Paris'))
              offset_hours = int(paris.utcoffset().total_seconds() // 3600)
              expected_utc_hour = (8 - offset_hours) % 24
              schedule = os.environ.get('EVENT_SCHEDULE', '')
              try:
                  parts = schedule.split()
                  scheduled_hour = int(parts[1])
              except Exception:
                  scheduled_hour = -1
              run = scheduled_hour == expected_utc_hour
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          print('Run selected:', run)
          PY

      - name: Checkout triggering ref
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Compile V2 production sources
        if: steps.gate.outputs.run == 'true'
        run: python -m compileall -q a4c_common carburantscorse2 scripts

      - name: Validate dashboard loader
        if: steps.gate.outputs.run == 'true'
        run: python scripts/migrate_index_data_source.py index.html --check

      - name: Pin latest validated C1 V2 bundle
        if: steps.gate.outputs.run == 'true'
        id: c1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh release list \
            --repo FredericP555/carburantscorse1 \
            --limit 50 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("a4c-v2-shared-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "No validated C1 V2 production bundle found." >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Pinned C1 release: $tag"

      - name: Build production V2 candidate and resolve only new BDR IDs
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_v2_production_candidate.py
          --tag-prefix "$C1_V2_TAG_PREFIX"
          --release-tag "${{ steps.c1.outputs.release_tag }}"

      - name: Verify fresh pinned C1 release and official stock
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m scripts.check_shared_freshness
          --candidate outputs/v2-production-candidate.json
          --baseline data.json
          --max-release-age-hours 12
          --max-source-age-days 4

      - name: Verify controlled V2 promotion contract
        if: steps.gate.outputs.run == 'true'
        run: python scripts/promote_v2_candidate.py

      - name: Detect C2 data change
        if: steps.gate.outputs.run == 'true'
        id: changed
        shell: bash
        run: |
          if cmp -s data.json outputs/v2-production-candidate.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "C2 V2 candidate is an exact no-op."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "C2 has publishable V2 changes."
          fi

      - name: Promote verified C2 V2 candidate in workspace
        if: steps.gate.outputs.run == 'true'
        run: python scripts/promote_v2_candidate.py --promote

      - name: Generate homepage summary from promoted data
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum data.json | cut -d' ' -f1)
          python scripts/build_homepage_summary.py --output homepage-summary.json
          after=$(sha256sum data.json | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "data.json was modified by the homepage summary generator" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('homepage-summary.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'a4c-homepage-summary-v1'
          if p['quality']['r2_unavailable'] != 0:
              raise SystemExit('Public summary not published because R2 is unavailable')
          source = p['source']
          print('Homepage summary generated through', source['daily_data_through'])
          print('UFIP observed through', source['ufip_last_observed_date'])
          PY

      - name: Upload weekly V2 audit
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: carburantscorse2-v2-weekly-audit
          path: |
            outputs/v2-production-candidate.json
            outputs/v2-production-summary.json
            outputs/ufip/c1_shared_meta.json
            outputs/c1/shared_release_tag.txt
            outputs/c1/corse_station_brands.json
            config/bdr_station_brands.json
            homepage-summary.json
          retention-days: 30

      - name: Commit production data, registry and homepage summary together
        if: steps.gate.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json config/bdr_station_brands.json homepage-summary.json
          if git diff --cached --quiet; then
            echo "No C2 repository publication commit required."
            exit 0
          fi

          staged=$(git diff --cached --name-only)
          if [ "${{ steps.changed.outputs.changed }}" = "true" ]; then
            target=$(python -c "import json; print(json.load(open('outputs/v2-production-summary.json'))['target_end'])")
            msg="Update carburantscorse2 V2 data through $target"
          elif printf '%s\n' "$staged" | grep -qx 'config/bdr_station_brands.json'; then
            msg="Resolve new BDR station brands"
          else
            msg="Refresh homepage fuel summary"
          fi
          git commit -m "$msg"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Write concise weekly summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## C2 V2 weekly production')
          p=Path('outputs/v2-production-summary.json')
          if p.exists():
              o=json.loads(p.read_text(encoding='utf-8'))
              e=o.get('engine') or {}
              g=o.get('official_event_guards') or {}
              print(f"- Pinned C1 release: `{o.get('c1_release_tag')}`")
              print(f"- Daily data through: {o.get('target_end')}")
              print(f"- Weekly data through: {o.get('weekly_end')}")
              print(f"- Rewritten rows: {o.get('rewritten_rows_total',0):,}")
              print(f"- Appended rows: {o.get('added_rows_total',0):,}")
              print(f"- R2 calls: {e.get('r2_calls',0):,}; unavailable: {e.get('r2_unavailable',0):,}")
              print(f"- Official event rows: {g.get('event_rows',0):,}")
          h=Path('homepage-summary.json')
          if h.exists():
              s=json.loads(h.read_text(encoding='utf-8'))
              print(f"- Homepage summary through: {s['source']['daily_data_through']}")
              print(f"- UFIP observed through: {s['source']['ufip_last_observed_date']}")
          PY
