name: Update carburantscorse2 weekly

on:
  schedule:
    # Two UTC slots cover 07:40 Europe/Paris across DST; the gate below keeps only one.
    - cron: '40 5 * * 1'
    - cron: '40 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: carburantscorse2-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Select the 07:40 Europe/Paris slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              run = True
          else:
              paris = datetime.now(ZoneInfo('Europe/Paris'))
              offset_hours = int(paris.utcoffset().total_seconds() // 3600)
              expected_utc_hour = (7 - offset_hours) % 24
              schedule = os.environ.get('EVENT_SCHEDULE', '')
              try:
                  parts = schedule.split()
                  scheduled_hour = int(parts[1])
              except Exception:
                  scheduled_hour = -1
              # The two cron entries carry the minute. The gate only chooses which UTC
              # hour corresponds to 07:xx Europe/Paris, so changing the common cron minute
              # cannot silently disable production.
              run = scheduled_hour == expected_utc_hour

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          print('Run selected:', run)
          PY

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Validate dashboard loader
        if: steps.gate.outputs.run == 'true'
        run: python scripts/migrate_index_data_source.py index.html --check

      - name: Build append-only candidate and resolve only new BDR IDs
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.build_append_candidate_incremental --official-source shared

      - name: Verify fresh c1 release and official stock
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m scripts.check_shared_freshness
          --candidate outputs/candidate-data.json
          --baseline data.json
          --max-release-age-hours 12
          --max-source-age-days 4

      - name: Promote candidate after append-only checks
        if: steps.gate.outputs.run == 'true'
        id: promote
        run: python -m scripts.promote_candidate

      - name: Upload audit candidate
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: carburantscorse2-weekly-audit
          path: |
            outputs/candidate-data.json
            outputs/candidate-summary.json
            config/bdr_station_brands.json
          retention-days: 30

      - name: Commit updated data and incremental BDR registry
        if: steps.gate.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json config/bdr_station_brands.json
          git diff --cached --quiet && exit 0
          if [ "${{ steps.promote.outputs.changed }}" = "true" ]; then
            msg="Update carburantscorse2 data through ${{ steps.promote.outputs.daily_target_end }}"
          else
            msg="Resolve new BDR station brands"
          fi
          git commit -m "$msg"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger GitHub Pages rebuild
        if: steps.gate.outputs.run == 'true' && steps.promote.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          if [ "$code" != "201" ]; then
            echo "GitHub Pages build trigger returned HTTP $code" >&2
            exit 1
          fi

      - name: No-op summary
        if: steps.gate.outputs.run == 'true' && steps.promote.outputs.changed != 'true'
        run: echo "No new publishable price point; only an incremental station registry change may have been committed."
