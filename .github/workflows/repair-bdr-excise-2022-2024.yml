name: One-time C2-01 BDR excise repair

on:
  push:
    branches: [main]
    paths:
      - carburantscorse2/margins.py
      - scripts/repair_bdr_excise_2022_2024.py
      - tests/test_bdr_excise_repair.py
      - tests/test_common.py
      - .github/workflows/repair-bdr-excise-2022-2024.yml

permissions:
  contents: write

concurrency:
  group: c2-01-bdr-excise-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests before repair
        run: python -m unittest discover -s tests -v
      - name: Compile repair sources
        run: python -m compileall -q carburantscorse2 scripts
      - name: Validate repair candidate without writing
        run: python scripts/repair_bdr_excise_2022_2024.py
      - name: Apply guarded C2-01 repair
        run: python scripts/repair_bdr_excise_2022_2024.py --apply
      - name: Verify exact mutation scope
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' data.json index.html | sort)
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected files changed by C2-01 repair:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          python scripts/repair_bdr_excise_2022_2024.py
          python scripts/migrate_index_data_source.py index.html --check
      - name: Re-run unit tests after repair
        run: python -m unittest discover -s tests -v
      - name: Check inline dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          pathlib.Path('/tmp/carburantscorse2-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/carburantscorse2-inline.js
      - name: Commit repaired public margin history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "Repair C2 historic BDR excise margins (C2-01)"
          git push origin HEAD:main
