name: Repair UFIP margin week 2026-08-17 once

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-ufip-margin-20260817.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: repair-ufip-margin-20260817
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Repair only the 17 Aug apparent-margin week
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.repair_ufip_margin_week_20260817

      - name: Verify only data.json changed at runtime
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "No repair needed."
            exit 0
          fi
          if [ "$changed" != "data.json" ]; then
            echo "Unexpected runtime changes: $changed" >&2
            exit 1
          fi

      - name: Commit repaired margin
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Repair Gazole margin week 2026-08-17 with fresh UFIP"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          test "$code" = "201"
