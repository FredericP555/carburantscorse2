name: Apply editorial UI once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write

concurrency:
  group: carburantscorse2-editorial-ui-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/editorial-sync-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fix editorial patch idempotence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_dynamic_editorial.py')
          text=p.read_text(encoding='utf-8')
          old='''    if helper_marker in text:\n        start = text.index(helper_marker)\n        end = text.index(marker, start)\n        text = text[:start] + HELPERS + "\\n" + text[end:]\n    else:\n        text = text.replace(marker, HELPERS + "\\n" + marker, 1)'''
          new='''    helper_block = HELPERS.strip("\\n")\n    if helper_marker in text:\n        marker_start = text.index(helper_marker)\n        start = len(text[:marker_start].rstrip("\\n"))\n        end = text.index(marker, marker_start)\n        prefix = text[:start].rstrip("\\n")\n        suffix = text[end:].lstrip("\\n")\n        text = prefix + "\\n\\n" + helper_block + "\\n\\n" + suffix\n    else:\n        text = text.replace(marker, helper_block + "\\n\\n" + marker, 1)'''
          if old not in text:
              raise SystemExit('Expected idempotence block not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply editorial patch
        run: python scripts/apply_dynamic_editorial.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard loader
        run: python scripts/migrate_index_data_source.py index.html --check
      - name: Check inline dashboard JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/c2-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/c2-inline.js
      - name: Commit patched dashboard
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- index.html scripts/apply_dynamic_editorial.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/apply_dynamic_editorial.py
          git commit -m 'Update Gazole record editorial text'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          if [ "$code" != "201" ]; then
            echo "GitHub Pages build trigger returned HTTP $code" >&2
            exit 1
          fi
