name: Apply full timeline context (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.pull_request.head.ref, 'ignore-this-never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/timeline-all-charts-v2
      - name: Apply full timeline patch
        run: python scripts/_patch_all_timeline_context.py
      - name: Verify timeline tests locally
        run: python -m unittest tests/test_all_chart_timeline_context.py -v
      - name: Commit patched dashboard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply c1 timeline context to every c2 chart [timeline-all]"
          git push origin HEAD:agent/timeline-all-charts-v2
