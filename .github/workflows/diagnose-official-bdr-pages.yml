name: Diagnose official BdR station pages (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/diagnose_official_bdr_pages.py
      - .github/workflows/diagnose-official-bdr-pages.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Test official government station pages with spaced GET retries
        env:
          PYTHONPATH: .
        run: python scripts/diagnose_official_bdr_pages.py
      - name: Save structured HTTP evidence (no registry changes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-bdr-station-http-diagnostic
          path: outputs/diagnostic-official-bdr-20261030.json
          retention-days: 7
