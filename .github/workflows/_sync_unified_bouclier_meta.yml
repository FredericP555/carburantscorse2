name: Sync unified bouclier metadata from c1 (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_sync_unified_bouclier_meta.yml'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build from c1 shared snapshot
        run: python -m scripts.build_append_candidate --official-source shared
      - name: Promote after append-only checks
        id: promote
        run: python -m scripts.promote_candidate
      - name: Require a metadata-only bouclier synchronization
        run: |
          test "${{ steps.promote.outputs.changed }}" = "true"
          test "${{ steps.promote.outputs.total_additions }}" = "0"
          test "${{ steps.promote.outputs.bouclier_changed }}" = "true"
          python - <<'PY'
          import json
          d=json.load(open('data.json',encoding='utf-8'))
          b=d['meta']['bouclier']
          for fuel in ('Gazole','SP95'):
              r=b[fuel]['rule']
              assert r['min_total_at_cap_count']==1
              assert r['confirmation_days']==2
              assert r['fill_gap_days']==1
              assert r['cap_tolerance_below_cents']==0.2
              assert r['cap_tolerance_above_cents']==0.1
          print('c2 now carries the exact unified c1 bouclier rule')
          print('Gazole ranges:',b['Gazole']['ranges'])
          print('SP95 ranges:',b['SP95']['ranges'])
          PY
      - name: Commit metadata-only c2 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && { echo 'Expected metadata diff missing'; exit 1; }
          git commit -m "Sync unified bouclier metadata from c1"
          git push origin HEAD:main
      - name: Rebuild c2 GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "Pages API HTTP $code"
          test "$code" = "201"
