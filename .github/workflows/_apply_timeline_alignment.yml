name: Apply timeline alignment (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/align-c1-timeline-total-shield' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-c1-timeline-total-shield
      - name: Check whether patch is still needed
        id: needed
        shell: bash
        run: |
          if grep -q "const PERIODES=" index.html; then echo "value=yes" >> "$GITHUB_OUTPUT"; else echo "value=no" >> "$GITHUB_OUTPUT"; fi
      - name: Apply alignment
        if: steps.needed.outputs.value == 'yes'
        run: python scripts/_patch_timeline_alignment.py
      - name: Verify aligned context
        if: steps.needed.outputs.value == 'yes'
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            "date:'2022-02-24',label:'Invasion Ukraine'",
            "date:'2025-11-17',label:'Sanctions Autorité'",
            'date:\'2026-02-28\',label:"Guerre d\'Iran"',
            "{d1:'2022-09-01',d2:'2022-11-15',alpha_fill:0.18}",
            "{d1:'2023-08-31',d2:'2023-10-13'}",
            "{d1:'2026-03-13',d2:'2026-05-28'}",
            'Bouclier TotalEnergies actif',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing expected markers: '+repr(missing))
          forbidden=['const PERIODES=','Sanction concurrence','li-209','li-225']
          found=[x for x in forbidden if x in s]
          if found: raise SystemExit('legacy markers remain: '+repr(found))
          PY
      - name: Commit aligned index
        if: steps.needed.outputs.value == 'yes'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Align c2 timeline context with c1 [timeline-patched]"
          git push origin HEAD:agent/align-c1-timeline-total-shield
