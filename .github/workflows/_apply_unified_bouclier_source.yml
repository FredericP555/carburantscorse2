name: Apply unified bouclier source (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-bouclier-rule
      - name: Apply dashboard patch
        run: python scripts/_patch_c2_bouclier_source.py
      - name: Run focused tests
        run: python -m unittest tests/test_timeline_context.py tests/test_all_chart_timeline_context.py -v
      - name: Commit dashboard patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use c1 metadata as sole bouclier source"
          git push origin HEAD:agent/unify-bouclier-rule
