name: Monthly territorial test

on:
  push:
    branches:
      - add-corse-station-geography-2026
    paths:
      - .github/workflows/monthly-territorial-test.yml
      - scripts/check_monthly_readiness.py
      - scripts/build_monthly_territorial.py
      - scripts/audit_epci_monthly.py
      - scripts/audit_monthly_territorial_coverage.py
      - scripts/validate_monthly_widget_contract.py
      - scripts/browser_smoke_monthly_widget.mjs
      - widgets/bilan-territorial/index.html
      - config/corse_station_geography_2026.csv
      - config/corse_station_geography_2026_additions.csv

permissions:
  contents: write

jobs:
  august-2026:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: add-corse-station-geography-2026
          fetch-depth: 0

      - name: Overlay current C2 production engine for the test only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          echo "C2_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          files=(
            a4c_common/corse_brand.py
            a4c_common/price_math.py
            a4c_common/shared_release.py
            a4c_common/source_freshness.py
            carburantscorse2/margins.py
            carburantscorse2/publication.py
            carburantscorse2/publication_margin.py
            carburantscorse2/r2_guard_v2.py
            carburantscorse2/reliability_policy_v2.py
            carburantscorse2/rotterdam_calibration_v2.py
            carburantscorse2/shield_phase_v2.py
            scripts/build_v2_production_candidate.py
            scripts/resolve_new_bdr_station_brands.py
            scripts/v2_event_guards.py
            config/bdr_categories_published_2026-06-06.csv
            config/bdr_station_brand_corrections.csv
            config/bdr_station_brands.json
            requirements.lock.txt
          )
          for p in "${files[@]}"; do
            mkdir -p "$(dirname "$p")"
            git show "origin/main:$p" > "$p"
          done
          git show origin/main:data.json > /tmp/c2-main-data.json
          echo "Runtime engine pinned to C2 main $(git rev-parse origin/main)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install current C2 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Prepare complete Corsica station geography for test
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          base = Path('config/corse_station_geography_2026.csv')
          additions = Path('config/corse_station_geography_2026_additions.csv')
          a = pd.read_csv(base, dtype=str)
          if additions.exists():
              b = pd.read_csv(additions, dtype=str)
              overlap = sorted(set(a.station_id) & set(b.station_id))
              if overlap:
                  raise SystemExit(f'Geography additions already present in base: {overlap}')
              a = pd.concat([a, b], ignore_index=True).sort_values('station_id')
              a.to_csv(base, index=False)
          if a.station_id.duplicated().any():
              raise SystemExit('Duplicate station_id in geography')
          if a.epci_siren.nunique() != 19:
              raise SystemExit(f'Expected 19 EPCI, got {a.epci_siren.nunique()}')
          print(f'Runtime geography: {len(a)} stations, {a.epci_siren.nunique()} EPCI')
          PY

      - name: Check August monthly readiness after successful C2 state
        run: >-
          PYTHONPATH=. python scripts/check_monthly_readiness.py
          --month 2026-08
          --as-of 2026-09-11
          --c2-data /tmp/c2-main-data.json
          --output outputs/monthly-readiness-2026-08.json
          --fail-if-not-ready

      - name: Verify readiness guard blocks incomplete, stale and finalized cases
        run: |
          set -euo pipefail
          mkdir -p /tmp/readiness
          python scripts/check_monthly_readiness.py \
            --month 2026-08 --as-of 2026-08-31 \
            --c2-data /tmp/c2-main-data.json \
            --output /tmp/readiness/incomplete.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('/tmp/c2-main-data.json').read_text())
          meta=src.setdefault('meta',{})
          meta['daily_target_end']='2026-08-31'
          meta['official_shared_source_max_date']='2026-08-31'
          Path('/tmp/readiness/stale-c2.json').write_text(json.dumps(src), encoding='utf-8')
          PY
          python scripts/check_monthly_readiness.py \
            --month 2026-08 --as-of 2026-09-11 \
            --c2-data /tmp/readiness/stale-c2.json \
            --output /tmp/readiness/stale.json
          mkdir -p /tmp/readiness/receipts
          printf '{"month":"2026-08"}\n' >/tmp/readiness/receipts/2026-08.json
          python scripts/check_monthly_readiness.py \
            --month 2026-08 --as-of 2026-09-11 \
            --c2-data /tmp/c2-main-data.json \
            --receipt-dir /tmp/readiness/receipts \
            --output /tmp/readiness/finalized.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('incomplete','stale','finalized'):
              p=Path('/tmp/readiness')/f'{name}.json'
              d=json.loads(p.read_text())
              if d['ready']:
                  raise SystemExit(f'{name} scenario was incorrectly marked ready')
              print(name, 'correctly blocked:', [c['key'] for c in d['checks'] if not c['ok']])
          PY

      - name: Build August 2026 with the C2 V2 engine and C2-pinned C1 release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/build_monthly_territorial.py
          --month 2026-08
          --c2-data /tmp/c2-main-data.json
          --output outputs/monthly-territories-2026-08.json

      - name: Validate widget/data contract
        run: >-
          PYTHONPATH=. python scripts/validate_monthly_widget_contract.py
          --data outputs/monthly-territories-2026-08.json
          --widget widgets/bilan-territorial/index.html

      - name: Install real-browser smoke-test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Render and exercise widget in desktop and mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/a4c-monthly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/widgets/bilan-territorial/index.html >/dev/null; then
              break
            fi
            sleep 0.5
          done
          node scripts/browser_smoke_monthly_widget.mjs \
            --url 'http://127.0.0.1:8765/widgets/bilan-territorial/index.html?data=/outputs/monthly-territories-2026-08.json' \
            --output outputs/monthly-widget-browser-smoke-2026-08.json

      - name: Audit Calvi Balagne SP95 station by station
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/audit_epci_monthly.py
          --month 2026-08
          --epci-siren 242020105
          --fuel SP95
          --c2-data /tmp/c2-main-data.json
          --output outputs/calvi-balagne-sp95-2026-08-audit.json
          --markdown outputs/calvi-balagne-sp95-2026-08-audit.md

      - name: Audit territorial coverage across all EPCI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/audit_monthly_territorial_coverage.py
          --month 2026-08
          --c2-data /tmp/c2-main-data.json
          --output outputs/monthly-territorial-coverage-2026-08-audit.json
          --markdown outputs/monthly-territorial-coverage-2026-08-audit.md

      - name: Build August conformance summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('outputs/monthly-territories-2026-08.json').read_text(encoding='utf-8'))
          rows = data['epci']
          meta = data['meta']
          lines = ['# Contrôle territorial C2 V2 — août 2026', '']
          lines.append(f"Moteur : {meta['c2_engine']} ; C2 main : {meta['c2_main_sha_runtime']}.")
          lines.append(f"Release C1 épinglée par C2 : {meta['c1_release_tag']}.")
          lines.append(f"Source officielle disponible jusqu'au : {meta['source_max_date']}.")
          lines.append(f"Registre géographique : {meta['geography_rows']} stations ; {meta['epci_count_registry']} EPCI.")
          lines.append('')

          for fuel in ('Gazole', 'SP95'):
            fr = [r for r in rows if r['fuel'] == fuel]
            rankable = [r for r in fr if r['rankable']]
            limited = [r for r in fr if not r['rankable']]
            ranked = sorted(rankable, key=lambda r: r['mean_eur_l'])
            lines += [f"## {fuel}", f"EPCI présents : {len(fr)} ; classables : {len(rankable)} ; hors classement : {len(limited)}."]
            if ranked:
              lo, hi = ranked[0], ranked[-1]
              lines.append(f"Plus bas : {lo['epci_nom']} {lo['mean_eur_l']:.4f} €/L ; plus haut : {hi['epci_nom']} {hi['mean_eur_l']:.4f} €/L ; écart {(hi['mean_eur_l']-lo['mean_eur_l'])*100:.2f} c/L.")
            for scope in ('all', 'network'):
              c = data['corse_vs_bdr'][fuel][scope]
              lines.append(f"Corse/BdR {scope} : {c['gap_ht_cpl']:+.2f} c/L HT ; {c['gap_ttc_cpl']:+.2f} c/L TTC ; jours valides {c['valid_days']}.")
            lines.append('')
            lines.append('| EPCI | Prix moyen | vs Corse | Dispersion moyennes stations | Stations | Couverture temporelle échantillon | Classable |')
            lines.append('|---|---:|---:|---:|---:|---:|:---:|')
            for r in sorted(fr, key=lambda x: x['epci_nom']):
              lines.append(f"| {r['epci_nom']} | {r['mean_eur_l']:.4f} | {r['vs_corse_cpl']:+.2f} c/L | {r['station_mean_spread_cpl']:.2f} c/L | {r['n_stations']} | {100*r['coverage_ratio']:.1f} % | {'oui' if r['rankable'] else 'non'} |")
            lines.append('')

          audit = data.get('internal_audit', {}).get('engine', {})
          lines += ['## Contrôle moteur', f"Station-jours évalués par la politique V2 : {audit.get('evaluate_station_days')}.", f"R2 indisponible : {audit.get('r2_unavailable')}."]
          Path('outputs/monthly-territories-2026-08-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Commit only the isolated August test outputs and feature geography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            config/corse_station_geography_2026.csv \
            outputs/monthly-readiness-2026-08.json \
            outputs/monthly-territories-2026-08.json \
            outputs/monthly-territories-2026-08-summary.md \
            outputs/monthly-widget-browser-smoke-2026-08.json \
            outputs/calvi-balagne-sp95-2026-08-audit.json \
            outputs/calvi-balagne-sp95-2026-08-audit.md \
            outputs/monthly-territorial-coverage-2026-08-audit.json \
            outputs/monthly-territorial-coverage-2026-08-audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Validate August readiness guard and monthly prototype"
          git push origin HEAD:add-corse-station-geography-2026
