name: Monthly territorial test

on:
  push:
    branches:
      - add-corse-station-geography-2026
    paths:
      - .github/workflows/monthly-territorial-test.yml
      - scripts/check_monthly_readiness.py
      - scripts/build_monthly_territorial.py
      - scripts/validate_monthly_source_guards.py
      - scripts/write_monthly_receipt.py
      - scripts/audit_epci_monthly.py
      - scripts/audit_monthly_territorial_coverage.py
      - scripts/validate_monthly_widget_contract.py
      - scripts/browser_smoke_monthly_widget.mjs
      - widgets/bilan-territorial/index.html
      - config/corse_station_geography_2026.csv
      - docs/monthly-territorial-spec.md

permissions:
  contents: write
  actions: read

concurrency:
  group: monthly-territorial-feature-${{ github.ref }}
  cancel-in-progress: false

jobs:
  august-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: add-corse-station-geography-2026
          fetch-depth: 0

      - name: Build disposable integrated tree from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          echo "C2_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          integrated=/tmp/monthly-integrated
          rm -rf "$integrated"
          git worktree add --detach "$integrated" origin/main
          files=(
            .github/workflows/monthly-territorial-test.yml
            config/corse_station_geography_2026.csv
            docs/monthly-territorial-spec.md
            scripts/build_monthly_territorial.py
            scripts/check_monthly_readiness.py
            scripts/validate_monthly_source_guards.py
            scripts/write_monthly_receipt.py
            scripts/audit_epci_monthly.py
            scripts/audit_monthly_territorial_coverage.py
            scripts/validate_monthly_widget_contract.py
            scripts/browser_smoke_monthly_widget.mjs
            widgets/bilan-territorial/index.html
          )
          cd "$GITHUB_WORKSPACE"
          tar cf - "${files[@]}" | tar xf - -C "$integrated"
          echo "MONTHLY_INTEGRATED=$integrated" >> "$GITHUB_ENV"
          echo "Integrated test base: $main_sha"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install current C2 dependencies
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Validate integrated CI supply-chain contract
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: python -m unittest tests.test_ci_supply_chain_contracts -v

      - name: Fetch and validate latest C2 business-success receipt
        id: business
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --repo FredericP555/carburantscorse2 \
            --workflow verify-c2-publication.yml \
            --branch main \
            --status success \
            --limit 20 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')
          test -n "$run_id"
          rm -rf /tmp/c2-business && mkdir -p /tmp/c2-business
          gh run download "$run_id" \
            --repo FredericP555/carburantscorse2 \
            --name c2-business-success-receipt \
            --dir /tmp/c2-business
          receipt=/tmp/c2-business/c2-business-success.json
          test -s "$receipt"
          tag=$(python - <<'PY'
          import json
          print(json.load(open('data.json'))['meta']['v2']['c1_release_tag'])
          PY
          )
          python scripts/validate_current_c2_receipt.py \
            --receipt "$receipt" \
            --expected-tag "$tag" \
            --current-data data.json \
            --current-summary homepage-summary.json
          commit=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/c2-business/c2-business-success.json'))['commit'])
          PY
          )
          test "$commit" = "$C2_MAIN_SHA"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Check August readiness from proven C2 publication
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: >-
          PYTHONPATH=. python scripts/check_monthly_readiness.py
          --month 2026-08
          --as-of 2026-09-11
          --c2-data data.json
          --c2-summary homepage-summary.json
          --c2-business-receipt /tmp/c2-business/c2-business-success.json
          --expected-c2-commit "$C2_MAIN_SHA"
          --receipt-dir /tmp/monthly-final-receipts
          --output outputs/monthly-readiness-2026-08.json
          --fail-if-not-ready

      - name: Verify readiness blocks incomplete stale finalized and corrupt cases
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/readiness && mkdir -p /tmp/readiness
          common=(--month 2026-08 --c2-summary homepage-summary.json --c2-business-receipt /tmp/c2-business/c2-business-success.json --expected-c2-commit "$C2_MAIN_SHA")
          python scripts/check_monthly_readiness.py "${common[@]}" --as-of 2026-08-31 --c2-data data.json --output /tmp/readiness/incomplete.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data.json').read_text())
          d['meta']['daily_target_end']='2026-08-31'
          d['meta']['official_shared_source_max_date']='2026-08-31'
          Path('/tmp/readiness/stale-data.json').write_text(json.dumps(d), encoding='utf-8')
          PY
          python scripts/check_monthly_readiness.py "${common[@]}" --as-of 2026-09-11 --c2-data /tmp/readiness/stale-data.json --output /tmp/readiness/stale.json
          mkdir -p /tmp/readiness/final /tmp/readiness/corrupt
          printf '{"schema":"a4c-monthly-final-receipt-v1","status":"final","month":"2026-08"}\n' >/tmp/readiness/final/2026-08.json
          python scripts/check_monthly_readiness.py "${common[@]}" --as-of 2026-09-11 --c2-data data.json --receipt-dir /tmp/readiness/final --output /tmp/readiness/finalized.json
          printf '{broken\n' >/tmp/readiness/corrupt/2026-08.json
          python scripts/check_monthly_readiness.py "${common[@]}" --as-of 2026-09-11 --c2-data data.json --receipt-dir /tmp/readiness/corrupt --output /tmp/readiness/corrupt.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('incomplete','stale','finalized','corrupt'):
              d=json.loads((Path('/tmp/readiness')/f'{name}.json').read_text())
              if d['ready']:
                  raise SystemExit(f'{name} scenario incorrectly marked ready')
              print(name, [c['key'] for c in d['checks'] if not c['ok']])
          PY

      - name: Snapshot mutable C2 helper inputs inside disposable tree
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: |
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json

      - name: Fail closed on unknown Corsica IDs and BDR perimeter
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/validate_monthly_source_guards.py
          --month 2026-08
          --c2-data data.json
          --output outputs/monthly-source-guards-2026-08.json

      - name: Restore mutable helper inputs before build
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: |
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Build August in disposable integrated tree
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          C2_MAIN_SHA: ${{ env.C2_MAIN_SHA }}
        run: >-
          PYTHONPATH=. python scripts/build_monthly_territorial.py
          --month 2026-08
          --c2-data data.json
          --output outputs/monthly-territories-2026-08.json

      - name: Validate JSON widget contract
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: >-
          PYTHONPATH=. python scripts/validate_monthly_widget_contract.py
          --data outputs/monthly-territories-2026-08.json
          --widget widgets/bilan-territorial/index.html

      - name: Install real-browser smoke-test dependency
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Exercise all 38 cases in desktop and mobile Chrome
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/a4c-monthly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/widgets/bilan-territorial/index.html >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/browser_smoke_monthly_widget.mjs \
            --url 'http://127.0.0.1:8765/widgets/bilan-territorial/index.html?data=/outputs/monthly-territories-2026-08.json' \
            --output outputs/monthly-widget-browser-smoke-2026-08.json

      - name: Restore helper input before diagnostic audits
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: |
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Audit Calvi Balagne SP95 station by station
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/audit_epci_monthly.py
          --month 2026-08
          --epci-siren 242020105
          --fuel SP95
          --c2-data data.json
          --output outputs/calvi-balagne-sp95-2026-08-audit.json
          --markdown outputs/calvi-balagne-sp95-2026-08-audit.md

      - name: Restore helper input before coverage audit
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: |
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Audit territorial coverage across all EPCI
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=. python scripts/audit_monthly_territorial_coverage.py
          --month 2026-08
          --c2-data data.json
          --output outputs/monthly-territorial-coverage-2026-08-audit.json
          --markdown outputs/monthly-territorial-coverage-2026-08-audit.md

      - name: Build August conformance summary
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/monthly-territories-2026-08.json').read_text())
          lines=['# Contrôle territorial C2 V2 — août 2026','']
          m=d['meta']
          lines += [f"Moteur : {m['c2_engine']} ; C2 main : {m['c2_main_sha_runtime']}.", f"Release C1 : {m['c1_release_tag']}.", f"Registre géographique : {m['geography_rows']} stations ; {m['epci_count_registry']} EPCI.", '']
          for fuel in ('Gazole','SP95'):
              rows=[r for r in d['epci'] if r['fuel']==fuel]
              rank=[r for r in rows if r['rankable']]
              lines += [f'## {fuel}', f'EPCI présents : {len(rows)} ; classables : {len(rank)} ; hors classement : {len(rows)-len(rank)}.', '']
          Path('outputs/monthly-territories-2026-08-summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Write and prove immutable monthly receipt semantics
        working-directory: ${{ env.MONTHLY_INTEGRATED }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-final-receipts && mkdir -p /tmp/monthly-final-receipts
          receipt=/tmp/monthly-final-receipts/2026-08.json
          python scripts/write_monthly_receipt.py \
            --month 2026-08 \
            --dataset outputs/monthly-territories-2026-08.json \
            --readiness outputs/monthly-readiness-2026-08.json \
            --source-guards outputs/monthly-source-guards-2026-08.json \
            --browser-smoke outputs/monthly-widget-browser-smoke-2026-08.json \
            --widget widgets/bilan-territorial/index.html \
            --geography config/corse_station_geography_2026.csv \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --output "$receipt"
          if python scripts/write_monthly_receipt.py \
            --month 2026-08 \
            --dataset outputs/monthly-territories-2026-08.json \
            --readiness outputs/monthly-readiness-2026-08.json \
            --source-guards outputs/monthly-source-guards-2026-08.json \
            --browser-smoke outputs/monthly-widget-browser-smoke-2026-08.json \
            --widget widgets/bilan-territorial/index.html \
            --geography config/corse_station_geography_2026.csv \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --output "$receipt"; then
            echo 'Second receipt write unexpectedly succeeded' >&2
            exit 1
          fi
          cp "$receipt" outputs/monthly-final-receipt-test-2026-08.json

      - name: Copy only approved test outputs back to feature workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/outputs"
          files=(
            monthly-readiness-2026-08.json
            monthly-source-guards-2026-08.json
            monthly-territories-2026-08.json
            monthly-territories-2026-08-summary.md
            monthly-widget-browser-smoke-2026-08.json
            monthly-final-receipt-test-2026-08.json
            calvi-balagne-sp95-2026-08-audit.json
            calvi-balagne-sp95-2026-08-audit.md
            monthly-territorial-coverage-2026-08-audit.json
            monthly-territorial-coverage-2026-08-audit.md
          )
          for f in "${files[@]}"; do cp "$MONTHLY_INTEGRATED/outputs/$f" "$GITHUB_WORKSPACE/outputs/$f"; done

      - name: Commit only isolated feature-test outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            outputs/monthly-readiness-2026-08.json \
            outputs/monthly-source-guards-2026-08.json \
            outputs/monthly-territories-2026-08.json \
            outputs/monthly-territories-2026-08-summary.md \
            outputs/monthly-widget-browser-smoke-2026-08.json \
            outputs/monthly-final-receipt-test-2026-08.json \
            outputs/calvi-balagne-sp95-2026-08-audit.json \
            outputs/calvi-balagne-sp95-2026-08-audit.md \
            outputs/monthly-territorial-coverage-2026-08-audit.json \
            outputs/monthly-territorial-coverage-2026-08-audit.md
          git diff --cached --quiet && exit 0
          git commit -m "Revalidate hardened August monthly prototype"
          git push origin HEAD:add-corse-station-geography-2026
