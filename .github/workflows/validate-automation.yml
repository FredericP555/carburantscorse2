name: Validate c2 automation core

on:
  push:
    branches: [prep/45d-shield-policy]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      c1_release_tag:
        description: "Optional immutable C1 shared release tag for live prep integration"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q a4c_common carburantscorse2 scripts
      - name: Validate dashboard data loader
        run: python scripts/migrate_index_data_source.py index.html --check
      - name: Check inline dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          pathlib.Path('/tmp/carburantscorse2-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/carburantscorse2-inline.js

      # Live cross-repository integration is deliberately opt-in.  The prep branch
      # does not publish C1 releases before the post-Monday test, so ordinary pushes
      # must not accidentally validate against an older production C1 contract.
      - name: Fetch explicitly pinned C1 bundle for live integration
        if: github.event_name == 'workflow_dispatch' && inputs.c1_release_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/fetch_shared_ufip_from_c1.py
          --output-dir outputs/ufip
          --release-tag "${{ inputs.c1_release_tag }}"
      - name: Validate pinned C1 business contract
        if: github.event_name == 'workflow_dispatch' && inputs.c1_release_tag != ''
        run: python -m scripts.validate_pinned_c1_bundle
      - name: Build live append-only candidate with incremental BDR resolver
        if: github.event_name == 'workflow_dispatch' && inputs.c1_release_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.build_append_candidate_incremental --official-source shared
      - name: Exercise append-only promotion guard
        if: github.event_name == 'workflow_dispatch' && inputs.c1_release_tag != ''
        run: python -m scripts.promote_candidate
      - name: Upload candidate and audit summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.c1_release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: carburantscorse2-candidate
          path: |
            outputs/candidate-data.json
            outputs/candidate-summary.json
            outputs/ufip/c1_shared_meta.json
            outputs/c1/corse_station_brands.json
            outputs/c1/shared_release_tag.txt
            config/bdr_station_brands.json
          retention-days: 14
