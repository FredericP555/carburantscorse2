name: Validate c2 automation core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  C1_V2_TAG_PREFIX: a4c-v2-shared-

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q a4c_common carburantscorse2 scripts
      - name: Validate dashboard data loader
        run: python scripts/migrate_index_data_source.py index.html --check
      - name: Check inline dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          pathlib.Path('/tmp/carburantscorse2-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          PY
          node --check /tmp/carburantscorse2-inline.js
      - name: Pin latest validated C1 V2 bundle
        id: c1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh release list \
            --repo FredericP555/carburantscorse1 \
            --limit 50 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("a4c-v2-shared-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "No validated C1 V2 bundle found." >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Pinned C1 release: $tag"
      - name: Build production-shaped V2 candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_v2_production_candidate.py
          --tag-prefix "$C1_V2_TAG_PREFIX"
          --release-tag "${{ steps.c1.outputs.release_tag }}"
      - name: Exercise decoded per-fuel freshness contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.check_shared_freshness
          --candidate outputs/v2-production-candidate.json
          --baseline data.json
          --max-release-age-hours 100000
          --max-source-age-days 100000
      - name: Exercise V2 append-only promotion guard
        run: python scripts/promote_v2_candidate.py
      - name: Upload candidate and audit summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carburantscorse2-v2-pr-candidate
          path: |
            outputs/v2-production-candidate.json
            outputs/v2-production-summary.json
            outputs/ufip/c1_shared_meta.json
            outputs/c1/shared_release_tag.txt
            outputs/c1/corse_station_brands.json
            config/bdr_station_brands.json
          retention-days: 14
