name: Validate c2 automation core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q a4c_common carburantscorse2 scripts
      - name: Build live append-only candidate
        run: python -m scripts.build_append_candidate
      - name: Upload candidate and audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carburantscorse2-candidate
          path: |
            outputs/candidate-data.json
            outputs/candidate-summary.json
          retention-days: 14
