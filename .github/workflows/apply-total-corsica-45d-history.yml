name: Apply Total Corsica SP95 historical correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-total-corsica-45d-history.yml'
      - 'scripts/build_total_corsica_45d_historical_correction.py'
      - 'scripts/audit_total_corsica_45d_retrospective.py'

permissions:
  contents: write

concurrency:
  group: c2-main-writers
  cancel-in-progress: false

env:
  PYTHONPATH: .
  CORRECTION_RELEASE_TAG: a4c-v2-shared-20260921T160119Z-35622254213
  CORRECTION_CANDIDATE_SHA256: 5a76ba52f4ce37973f5e2798b0661d30da52b8847c3f7cd077884952c0cee6be

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Capture writer base SHA
        run: echo "WRITER_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Run unit tests before correction
        run: python -m unittest discover -s tests -v

      - name: Compile production and correction sources
        run: python -m compileall -q a4c_common carburantscorse2 scripts

      - name: Build correction candidate without touching production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum data.json | awk '{print $1}')
          python scripts/build_total_corsica_45d_historical_correction.py \
            --release-tag "$CORRECTION_RELEASE_TAG"
          after=$(sha256sum data.json | awk '{print $1}')
          test "$before" = "$after"
          git diff --exit-code -- data.json homepage-summary.json config/bdr_station_brands.json

      - name: Verify exact correction contract
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum outputs/historical-correction-total-corsica-45d/candidate.json | awk '{print $1}')
          test "$actual" = "$CORRECTION_CANDIDATE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('outputs/historical-correction-total-corsica-45d/report.json').read_text(encoding='utf-8'))
          c = p['correction']
          assert p['writes_data_json'] is False
          assert p['baseline_sha256'] == '7fb5b2ff018e78483f4a08fcfe5bb10a791ac844ceaa5ebc6097082b9e72c89b'
          assert p['release_tag'] == 'a4c-v2-shared-20260921T160119Z-35622254213'
          assert c['reintroduced_station_days'] == 663
          assert len(c['unique_station_ids']) == 17
          assert c['bdr_eligibility_difference_count'] == 0
          assert c['gazole_history_changed'] is False
          assert c['margins_changed'] is False
          assert c['daily_rows_changed'] == 240
          assert c['weekly_rows_changed'] == 32
          print('Historical correction contract: OK')
          PY

      - name: Build corrected homepage summary from candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_homepage_summary.py
          --data outputs/historical-correction-total-corsica-45d/candidate.json
          --output outputs/historical-correction-total-corsica-45d/homepage-summary.json

      - name: Verify corrected public headline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('outputs/historical-correction-total-corsica-45d/homepage-summary.json').read_text(encoding='utf-8'))
          assert p['source']['daily_data_through'] == '2026-09-20'
          assert p['source']['weekly_data_through'] == '2026-09-20'
          assert p['quality']['r2_unavailable'] == 0
          assert p['homepage_default']['gazole']['gap_ht_c_l'] == 3.44
          assert p['homepage_default']['sp95']['gap_ht_c_l'] == 1.02
          print('Corrected homepage summary: OK')
          PY

      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: total-corsica-sp95-historical-correction
          path: |
            outputs/historical-correction-total-corsica-45d/candidate.json
            outputs/historical-correction-total-corsica-45d/report.json
            outputs/historical-correction-total-corsica-45d/homepage-summary.json
          retention-days: 90

      - name: Apply verified candidate in workspace
        shell: bash
        run: |
          set -euo pipefail
          cp outputs/historical-correction-total-corsica-45d/candidate.json data.json
          cp outputs/historical-correction-total-corsica-45d/homepage-summary.json homepage-summary.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data.json').read_text(encoding='utf-8'))
          corrections = ((data.get('meta') or {}).get('v2') or {}).get('historical_corrections') or []
          ids = [item.get('id') for item in corrections if isinstance(item, dict)]
          assert ids.count('total-corsica-sp95-shield-45d-20260921') == 1
          print('Correction provenance embedded in data.json: OK')
          PY

          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort | tr '\n' ' ')" = "data.json homepage-summary.json "

      - name: Guard remote main and publish correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          remote_sha=$(git rev-parse origin/main)
          if [ "$remote_sha" != "$WRITER_BASE_SHA" ]; then
            echo "Main advanced while historical correction was running: base=$WRITER_BASE_SHA remote=$remote_sha" >&2
            exit 1
          fi

          git add data.json homepage-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply historical SP95 shield correction"
          git push origin HEAD:main
