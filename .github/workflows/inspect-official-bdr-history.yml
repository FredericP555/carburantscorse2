name: Inspect historical BdR IDs in validated C1 official data

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/inspect_official_bdr_history.py
      - .github/workflows/inspect-official-bdr-history.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Read C1 immutable official station declarations in read-only mode
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/inspect_official_bdr_history.py
