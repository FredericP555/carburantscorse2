name: Bootstrap c2 live shared publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-c2-live.yml'

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build append-only candidate from shared c1 source through 2026-08-18
        run: python -m scripts.build_append_candidate --official-source shared --end 2026-08-18

      - name: Promote candidate after append-only checks
        id: promote
        run: python -m scripts.promote_candidate

      - name: Commit updated data.json
        if: steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update carburantscorse2 data through ${{ steps.promote.outputs.daily_target_end }}"
          git push origin HEAD:main

      - name: Trigger GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "GitHub Pages API HTTP $code"
          test "$code" = "201"
