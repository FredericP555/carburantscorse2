name: Bootstrap c2 bouclier metadata (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_bootstrap_bouclier_meta.yml'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message == 'Bootstrap c2 bouclier metadata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build candidate from fresh shared c1 release
        run: python -m scripts.build_append_candidate --official-source shared
      - name: Verify public series unchanged and promote bouclier metadata
        id: promote
        run: python -m scripts.promote_candidate
      - name: Require metadata-only change
        run: |
          test "${{ steps.promote.outputs.changed }}" = "true"
          test "${{ steps.promote.outputs.total_additions }}" = "0"
          test "${{ steps.promote.outputs.bouclier_changed }}" = "true"
      - name: Commit metadata-only update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && { echo 'Expected metadata diff missing'; exit 1; }
          git commit -m "Sync c2 bouclier metadata"
          git push origin HEAD:main
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "Pages API HTTP $code"
          test "$code" = "201"
