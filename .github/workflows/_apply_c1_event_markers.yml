name: Apply c1 event markers to c2 (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-c1-event-markers
      - name: Apply event-marker patch
        run: python scripts/_patch_c1_event_markers.py
      - name: Verify focused timeline tests
        run: python -m unittest tests/test_all_chart_timeline_context.py -v
      - name: Commit production change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Mirror c1 event markers in c2"
          git push origin HEAD:agent/sync-c1-event-markers
