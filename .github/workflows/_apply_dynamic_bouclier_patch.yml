name: Apply dynamic bouclier patch (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamic-bouclier-meta
      - name: Apply patch
        run: python scripts/_patch_dynamic_bouclier.py
      - name: Run focused test
        run: python -m unittest tests/test_dynamic_bouclier_meta.py -v
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add a4c_common/shared_release.py scripts/build_append_candidate.py index.html
          git diff --cached --quiet && exit 0
          git commit -m "Consume dynamic c1 bouclier metadata"
          git push origin HEAD:agent/dynamic-bouclier-meta
