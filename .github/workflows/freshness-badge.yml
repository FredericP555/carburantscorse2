name: Validate freshness badge

on:
  pull_request:
    branches: [main]
    paths:
      - freshness.js
      - scripts/install_freshness_badge.py
      - .github/workflows/freshness-badge.yml
  push:
    branches: [main]
    paths:
      - freshness.js
      - scripts/install_freshness_badge.py
      - .github/workflows/freshness-badge.yml

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check freshness JavaScript syntax
        run: node --check freshness.js
      - name: Verify installer is idempotent and production HTML is already wired
        shell: bash
        run: |
          cp index.html /tmp/index-freshness.html
          python scripts/install_freshness_badge.py /tmp/index-freshness.html
          python scripts/install_freshness_badge.py /tmp/index-freshness.html
          test "$(grep -o '<script src="freshness.js"></script>' /tmp/index-freshness.html | wc -l)" -eq 1
          test "$(grep -o '<script src="freshness.js"></script>' index.html | wc -l)" -eq 1
          grep -q 'A4C_updateFreshnessBadge' freshness.js
          grep -q 'semaine complète au' freshness.js
          grep -q 'partielle au' freshness.js
