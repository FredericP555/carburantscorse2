name: Diagnose ENI comparison on official C1 station observations

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/check_eni_curve_from_c1.py
      - .github/workflows/diagnose-eni-curve.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Read official C1 release and compute ENI daily gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python scripts/check_eni_curve_from_c1.py
