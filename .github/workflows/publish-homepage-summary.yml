name: Publish homepage fuel summary

on:
  workflow_run:
    workflows:
      - Update carburantscorse2 weekly
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - scripts/build_homepage_summary.py
      - tests/test_homepage_summary.py
      - .github/workflows/publish-homepage-summary.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

env:
  PYTHONPATH: .

concurrency:
  group: carburantscorse2-homepage-summary
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate summary helpers
        run: python -m unittest discover -s tests -p 'test_homepage_summary.py' -v

      - name: Generate isolated public summary
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum data.json | cut -d' ' -f1)
          python scripts/build_homepage_summary.py --output homepage-summary.json
          after=$(sha256sum data.json | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "data.json was modified by the downstream summary generator" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('homepage-summary.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'a4c-homepage-summary-v1'
          if p['quality']['r2_unavailable'] != 0:
              raise SystemExit('Public summary not published because R2 is unavailable')
          print(json.dumps(p['homepage_default'], ensure_ascii=False, indent=2))
          PY

      - name: Detect summary change
        id: changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- homepage-summary.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Homepage summary is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Homepage summary has changed."
          fi

      - name: Commit summary only
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-summary.json
          git commit -m "Update homepage fuel summary"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Trigger GitHub Pages rebuild
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 3 -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          if [ "$code" != "201" ]; then
            echo "GitHub Pages build trigger returned HTTP $code" >&2
            exit 1
          fi

      - name: Write summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Homepage fuel summary')
          p = Path('homepage-summary.json')
          if p.exists():
              o = json.loads(p.read_text(encoding='utf-8'))
              h = o['homepage_default']
              print(f"- Week: {h['week_start']} → {h['week_end']}")
              print(f"- Gazole network gap: {h['gazole']['gap_ht_c_l']:+.2f} c€/L HT ({h['gazole']['gap_change_wow_c_l']:+.2f} c WoW)")
              print(f"- SP95 network gap: {h['sp95']['gap_ht_c_l']:+.2f} c€/L HT ({h['sp95']['gap_change_wow_c_l']:+.2f} c WoW)")
              print(f"- Daily data through: {o['source']['daily_data_through']}")
              print(f"- UFIP observed through: {o['source']['ufip_last_observed_date']}")
          PY
