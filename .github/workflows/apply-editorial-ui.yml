name: Apply dynamic editorial UI

on:
  workflow_run:
    workflows: ["Validate c2 automation core"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - .editorial-deploy-check
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: carburantscorse2-editorial-ui
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply dynamic editorial patch
        run: python scripts/apply_dynamic_editorial.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard loader
        run: python scripts/migrate_index_data_source.py index.html --check
      - name: Check inline dashboard JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/c2-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/c2-inline.js
      - name: Commit patched dashboard
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make c2 editorial text dynamic'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          if [ "$code" != "201" ]; then
            echo "GitHub Pages build trigger returned HTTP $code" >&2
            exit 1
          fi
