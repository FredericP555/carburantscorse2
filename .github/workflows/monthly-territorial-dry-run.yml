name: Monthly territorial dry-run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/monthly-territorial-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: monthly-territorial-dry-run-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  MONTH: '2026-08'
  PROTOTYPE_REF: 'c6d8ba376de8cf0e8795b8efa44038bf8c97a3d7'

jobs:
  august-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Create isolated execution worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-run /tmp/monthly-artifact /tmp/monthly-final-receipts
          git worktree add --detach /tmp/monthly-run HEAD
          mkdir -p /tmp/monthly-artifact /tmp/monthly-final-receipts
          echo "RUN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "C2_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Resolve a still-current C2 business-success receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          tag=$(python - <<'PY'
          import json
          print(json.load(open('data.json'))['meta']['v2']['c1_release_tag'])
          PY
          )
          rm -rf /tmp/c2-business-candidates /tmp/c2-business
          mkdir -p /tmp/c2-business-candidates /tmp/c2-business
          found=''
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dir="/tmp/c2-business-candidates/$run_id"
            mkdir -p "$dir"
            if gh run download "$run_id" \
                 --repo FredericP555/carburantscorse2 \
                 --name c2-business-success-receipt \
                 --dir "$dir" >/dev/null 2>&1; then
              receipt="$dir/c2-business-success.json"
              if [ -s "$receipt" ] && python scripts/validate_current_c2_receipt.py \
                   --receipt "$receipt" \
                   --expected-tag "$tag" \
                   --current-data data.json \
                   --current-summary homepage-summary.json >/dev/null 2>&1; then
                cp "$receipt" /tmp/c2-business/c2-business-success.json
                found="$run_id"
                break
              fi
            fi
          done < <(gh run list \
            --repo FredericP555/carburantscorse2 \
            --workflow verify-c2-publication.yml \
            --branch main \
            --status success \
            --limit 20 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
          test -n "$found"
          test -s /tmp/c2-business/c2-business-success.json
          echo "BUSINESS_RUN_ID=$found" >> "$GITHUB_ENV"
          echo "Using C2 business-success run $found"

      - name: Prove August readiness from current C2 state
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          as_of=$(TZ=Europe/Paris date +%F)
          python scripts/check_monthly_readiness.py \
            --month "$MONTH" \
            --as-of "$as_of" \
            --c2-data data.json \
            --c2-summary homepage-summary.json \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --receipt-dir /tmp/monthly-final-receipts \
            --output /tmp/monthly-artifact/monthly-readiness-2026-08.json \
            --fail-if-not-ready

      - name: Run two-month source guards with bounded BDR backfill
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/validate_monthly_source_guards_hardened.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output /tmp/monthly-artifact/monthly-source-guards-2026-08.json
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Build August dataset with the integrated main engine
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/build_monthly_territorial_hardened.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output /tmp/monthly-artifact/monthly-territories-2026-08.json
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Compare functional results with the validated August prototype
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/FredericP555/carburantscorse2/${PROTOTYPE_REF}/outputs/monthly-territories-2026-08.json" \
            -o /tmp/validated-august-prototype.json
          python - <<'PY'
          import json
          from pathlib import Path
          new=json.loads(Path('/tmp/monthly-artifact/monthly-territories-2026-08.json').read_text(encoding='utf-8'))
          old=json.loads(Path('/tmp/validated-august-prototype.json').read_text(encoding='utf-8'))
          sections=['corse','corse_vs_bdr','epci','localities']
          comparisons={name:new.get(name)==old.get(name) for name in sections}
          if not all(comparisons.values()):
              raise SystemExit(f'Functional August mismatch: {comparisons}')
          a=new['internal_audit']['bdr_category_backfill']
          if a['applied_station_days'] != 6 or a['applied_gms_station_days'] != 6 or a['applied_network_station_days'] != 0:
              raise SystemExit(f'Unexpected Gardanne backfill audit: {a}')
          if a['rejected_conflicts']:
              raise SystemExit(f'Unexpected BDR backfill conflict: {a["rejected_conflicts"]}')
          result={
              'schema':'a4c-monthly-main-dry-run-equivalence-v1',
              'month':'2026-08',
              'functional_sections_equal_to_validated_prototype':comparisons,
              'c1_release_tag':new['meta']['c1_release_tag'],
              'c2_engine':new['meta']['c2_engine'],
              'runtime_commit':new['meta']['c2_main_sha_runtime'],
              'bdr_backfill':a,
          }
          Path('/tmp/monthly-artifact/monthly-functional-equivalence-2026-08.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Run territorial coverage and Calvi SP95 audits
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/audit_epci_monthly.py \
            --month "$MONTH" --epci-siren 242020105 --fuel SP95 \
            --c2-data data.json \
            --output /tmp/monthly-artifact/calvi-balagne-sp95-2026-08-audit.json \
            --markdown /tmp/monthly-artifact/calvi-balagne-sp95-2026-08-audit.md
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/audit_monthly_territorial_coverage.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output /tmp/monthly-artifact/monthly-territorial-coverage-2026-08-audit.json \
            --markdown /tmp/monthly-artifact/monthly-territorial-coverage-2026-08-audit.md
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Exercise the validated widget only in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-web /tmp/monthly-widget-tools
          mkdir -p /tmp/monthly-web/widgets/bilan-territorial /tmp/monthly-web/outputs /tmp/monthly-widget-tools
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/FredericP555/carburantscorse2/${PROTOTYPE_REF}/widgets/bilan-territorial/index.html" \
            -o /tmp/monthly-web/widgets/bilan-territorial/index.html
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/FredericP555/carburantscorse2/${PROTOTYPE_REF}/scripts/browser_smoke_monthly_widget.mjs" \
            -o /tmp/monthly-widget-tools/browser_smoke_monthly_widget.mjs
          cp /tmp/monthly-artifact/monthly-territories-2026-08.json /tmp/monthly-web/outputs/monthly-territories-2026-08.json
          cd /tmp/monthly-widget-tools
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          cd /tmp/monthly-web
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/monthly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/widgets/bilan-territorial/index.html >/dev/null; then break; fi
            sleep 0.5
          done
          node /tmp/monthly-widget-tools/browser_smoke_monthly_widget.mjs \
            --url 'http://127.0.0.1:8765/widgets/bilan-territorial/index.html?data=/outputs/monthly-territories-2026-08.json' \
            --output /tmp/monthly-artifact/monthly-widget-browser-smoke-2026-08.json
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Create and re-check an ephemeral final receipt
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          RECEIPT=/tmp/monthly-final-receipts/2026-08.json
          python scripts/write_monthly_receipt.py \
            --month "$MONTH" \
            --dataset /tmp/monthly-artifact/monthly-territories-2026-08.json \
            --readiness /tmp/monthly-artifact/monthly-readiness-2026-08.json \
            --source-guards /tmp/monthly-artifact/monthly-source-guards-2026-08.json \
            --browser-smoke /tmp/monthly-artifact/monthly-widget-browser-smoke-2026-08.json \
            --widget /tmp/monthly-web/widgets/bilan-territorial/index.html \
            --geography config/corse_station_geography_2026.csv \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --output "$RECEIPT"
          test -s "$RECEIPT"
          if python scripts/write_monthly_receipt.py \
            --month "$MONTH" \
            --dataset /tmp/monthly-artifact/monthly-territories-2026-08.json \
            --readiness /tmp/monthly-artifact/monthly-readiness-2026-08.json \
            --source-guards /tmp/monthly-artifact/monthly-source-guards-2026-08.json \
            --browser-smoke /tmp/monthly-artifact/monthly-widget-browser-smoke-2026-08.json \
            --widget /tmp/monthly-web/widgets/bilan-territorial/index.html \
            --geography config/corse_station_geography_2026.csv \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --output "$RECEIPT"; then
            echo 'Second receipt write unexpectedly succeeded' >&2
            exit 1
          fi
          cp "$RECEIPT" /tmp/monthly-artifact/ephemeral-final-receipt-2026-08.json

      - name: Write dry-run manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('/tmp/monthly-artifact')
          files={}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
              'schema':'a4c-monthly-main-dry-run-v1',
              'status':'success',
              'month':'2026-08',
              'run_sha':os.environ.get('RUN_SHA'),
              'c2_main_sha':os.environ.get('C2_MAIN_SHA'),
              'c2_business_success_run_id':os.environ.get('BUSINESS_RUN_ID'),
              'publication':'none',
              'repository_write':'none',
              'wordpress':'untouched',
              'final_receipt_location':'ephemeral Actions artifact only',
              'files_sha256':files,
          }
          (root/'dry-run-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload dry-run evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monthly-territorial-dry-run-2026-08
          path: /tmp/monthly-artifact
          if-no-files-found: error
          retention-days: 30
