name: Monthly territorial dry-run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/monthly-territorial-dry-run.yml'
  workflow_dispatch:
    inputs:
      month:
        description: 'Optional completed month YYYY-MM; blank means previous calendar month'
        required: false
        type: string
  workflow_run:
    workflows: ["Verify C2 publication end-to-end"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: monthly-territorial-readonly
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PROTOTYPE_REF: 'c6d8ba376de8cf0e8795b8efa44038bf8c97a3d7'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      month: ${{ steps.target.outputs.month }}
      run_monthly: ${{ steps.gate.outputs.run_monthly }}
      business_run_id: ${{ steps.gate.outputs.business_run_id }}
    steps:
      - name: Resolve target month
        id: target
        env:
          REQUESTED_MONTH: ${{ github.event.inputs.month || '' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          as_of=$(TZ=Europe/Paris date +%F)
          requested="$REQUESTED_MONTH"
          # PR-only migration proof: exercise a completed month different from August.
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            requested='2026-07'
          fi
          month=$(python - "$as_of" "$requested" <<'PY'
          import re, sys
          from datetime import date, timedelta
          as_of=date.fromisoformat(sys.argv[1])
          requested=sys.argv[2].strip()
          if requested:
              if not re.fullmatch(r'\d{4}-\d{2}', requested):
                  raise SystemExit('workflow_dispatch month must be YYYY-MM')
              year, mon = map(int, requested.split('-'))
              if not 1 <= mon <= 12:
                  raise SystemExit('workflow_dispatch month must be YYYY-MM')
              first=date(year, mon, 1)
              if first >= as_of.replace(day=1):
                  raise SystemExit('workflow_dispatch month must be complete')
              print(requested)
          else:
              first=as_of.replace(day=1)
              print((first-timedelta(days=1)).strftime('%Y-%m'))
          PY
          )
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "Target month: $month"

      - name: Gate automatic duplicate runs
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.target.outputs.month }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'run_monthly=true' >> "$GITHUB_OUTPUT"
          echo 'business_run_id=' >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != 'workflow_run' ]; then
            echo 'Manual/PR dry-run: duplicate gate bypassed.'
            exit 0
          fi
          test "$UPSTREAM_CONCLUSION" = 'success'
          test "$UPSTREAM_BRANCH" = 'main'
          test -n "$UPSTREAM_RUN_ID"
          upstream=$(gh api "repos/FredericP555/carburantscorse2/actions/runs/$UPSTREAM_RUN_ID")
          test "$(jq -r '.status' <<<"$upstream")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$upstream")" = 'success'
          test "$(jq -r '.head_branch' <<<"$upstream")" = 'main'
          test "$(jq -r '.path' <<<"$upstream")" = '.github/workflows/verify-c2-publication.yml'
          echo "business_run_id=$UPSTREAM_RUN_ID" >> "$GITHUB_OUTPUT"
          artifact_name="monthly-territorial-dry-run-$MONTH"
          existing=$(python - "$artifact_name" <<'PY'
          import json, subprocess, sys
          artifact_name=sys.argv[1]
          repo='FredericP555/carburantscorse2'
          monthly_path='.github/workflows/monthly-territorial-dry-run.yml'
          def successful_main_artifact(artifact, lookup):
              if artifact.get('expired') is not False:
                  return False
              wr=artifact.get('workflow_run') or {}
              if wr.get('head_branch') != 'main' or not wr.get('id'):
                  return False
              run=lookup(wr['id'])
              return (
                  run.get('status') == 'completed'
                  and run.get('conclusion') == 'success'
                  and run.get('head_branch') == 'main'
                  and run.get('path') == monthly_path
              )
          # Contract tests: failed artifact must not block; successful main artifact must block;
          # successful non-main artifact must not block.
          fake=lambda rid: {
              1:{'status':'completed','conclusion':'failure','head_branch':'main','path':monthly_path},
              2:{'status':'completed','conclusion':'success','head_branch':'main','path':monthly_path},
              3:{'status':'completed','conclusion':'success','head_branch':'feature','path':monthly_path},
          }[rid]
          assert not successful_main_artifact({'expired':False,'workflow_run':{'id':1,'head_branch':'main'}}, fake)
          assert successful_main_artifact({'expired':False,'workflow_run':{'id':2,'head_branch':'main'}}, fake)
          assert not successful_main_artifact({'expired':False,'workflow_run':{'id':3,'head_branch':'feature'}}, fake)
          payload=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/artifacts?name={artifact_name}&per_page=100'], text=True))
          cache={}
          def live_lookup(rid):
              if rid not in cache:
                  cache[rid]=json.loads(subprocess.check_output(
                      ['gh','api',f'repos/{repo}/actions/runs/{rid}'], text=True))
              return cache[rid]
          matches=[a for a in payload.get('artifacts',[]) if successful_main_artifact(a, live_lookup)]
          print(len(matches))
          PY
          )
          if [ "$existing" -gt 0 ]; then
            echo 'run_monthly=false' >> "$GITHUB_OUTPUT"
            echo "Successful automatic dry-run for $MONTH already exists on main; no duplicate generated."
          else
            echo "No successful main dry-run for $MONTH; continuing from business-success run $UPSTREAM_RUN_ID."
          fi

  monthly:
    needs: prepare
    if: needs.prepare.outputs.run_monthly == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MONTH: ${{ needs.prepare.outputs.month }}
      TRIGGER_BUSINESS_RUN_ID: ${{ needs.prepare.outputs.business_run_id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Create isolated execution worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-run /tmp/monthly-artifact /tmp/monthly-final-receipts
          git worktree add --detach /tmp/monthly-run HEAD
          mkdir -p /tmp/monthly-artifact /tmp/monthly-final-receipts
          echo "RUN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "C2_MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Resolve a still-current C2 business-success receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          tag=$(python - <<'PY'
          import json
          print(json.load(open('data.json'))['meta']['v2']['c1_release_tag'])
          PY
          )
          rm -rf /tmp/c2-business-candidates /tmp/c2-business
          mkdir -p /tmp/c2-business-candidates /tmp/c2-business
          found=''
          if [ -n "$TRIGGER_BUSINESS_RUN_ID" ]; then
            candidates="$TRIGGER_BUSINESS_RUN_ID"
          else
            candidates=$(gh run list \
              --repo FredericP555/carburantscorse2 \
              --workflow verify-c2-publication.yml \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
          fi
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            dir="/tmp/c2-business-candidates/$run_id"
            mkdir -p "$dir"
            if gh run download "$run_id" \
                 --repo FredericP555/carburantscorse2 \
                 --name c2-business-success-receipt \
                 --dir "$dir" >/dev/null 2>&1; then
              receipt="$dir/c2-business-success.json"
              if [ -s "$receipt" ] && python scripts/validate_current_c2_receipt.py \
                   --receipt "$receipt" \
                   --expected-tag "$tag" \
                   --current-data data.json \
                   --current-summary homepage-summary.json >/dev/null 2>&1; then
                cp "$receipt" /tmp/c2-business/c2-business-success.json
                found="$run_id"
                break
              fi
            fi
          done <<< "$candidates"
          test -n "$found"
          test -s /tmp/c2-business/c2-business-success.json
          echo "BUSINESS_RUN_ID=$found" >> "$GITHUB_ENV"
          echo "Using C2 business-success run $found"

      - name: Prove monthly readiness from current C2 state
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          as_of=$(TZ=Europe/Paris date +%F)
          extra=()
          if { [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ -n "${{ github.event.inputs.month || '' }}" ]; } || [ "${{ github.event_name }}" = 'pull_request' ]; then
            extra+=(--allow-backfill)
          fi
          python scripts/check_monthly_readiness.py \
            --month "$MONTH" \
            --as-of "$as_of" \
            --c2-data data.json \
            --c2-summary homepage-summary.json \
            --c2-business-receipt /tmp/c2-business/c2-business-success.json \
            --receipt-dir /tmp/monthly-final-receipts \
            --output "/tmp/monthly-artifact/monthly-readiness-$MONTH.json" \
            --fail-if-not-ready \
            "${extra[@]}"

      - name: Run two-month source guards with bounded BDR backfill
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/validate_monthly_source_guards_hardened.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output "/tmp/monthly-artifact/monthly-source-guards-$MONTH.json"
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Build monthly dataset with the integrated main engine
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          C2_MAIN_SHA="$C2_MAIN_SHA" python scripts/build_monthly_territorial_hardened.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output "/tmp/monthly-artifact/monthly-territories-$MONTH.json"
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1

      - name: Compare August with the validated prototype when applicable
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MONTH" != '2026-08' ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          month=os.environ['MONTH']
          out={
              'schema':'a4c-monthly-main-dry-run-equivalence-v1',
              'month':month,
              'status':'not_applicable_non_august',
              'note':'Prototype equivalence is a one-time August 2026 migration proof.'
          }
          Path(f'/tmp/monthly-artifact/monthly-functional-equivalence-{month}.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
            exit 0
          fi
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/FredericP555/carburantscorse2/${PROTOTYPE_REF}/outputs/monthly-territories-2026-08.json" \
            -o /tmp/validated-august-prototype.json
          python - <<'PY'
          import json
          from pathlib import Path
          new=json.loads(Path('/tmp/monthly-artifact/monthly-territories-2026-08.json').read_text(encoding='utf-8'))
          old=json.loads(Path('/tmp/validated-august-prototype.json').read_text(encoding='utf-8'))
          sections=['corse','corse_vs_bdr','epci','localities']
          comparisons={name:new.get(name)==old.get(name) for name in sections}
          if not all(comparisons.values()):
              raise SystemExit(f'Functional August mismatch: {comparisons}')
          a=new['internal_audit']['bdr_category_backfill']
          if a['applied_station_days'] != 6 or a['applied_gms_station_days'] != 6 or a['applied_network_station_days'] != 0:
              raise SystemExit(f'Unexpected Gardanne backfill audit: {a}')
          if a['rejected_conflicts']:
              raise SystemExit(f'Unexpected BDR backfill conflict: {a["rejected_conflicts"]}')
          result={
              'schema':'a4c-monthly-main-dry-run-equivalence-v1',
              'month':'2026-08',
              'status':'equal',
              'functional_sections_equal_to_validated_prototype':comparisons,
              'c1_release_tag':new['meta']['c1_release_tag'],
              'c2_engine':new['meta']['c2_engine'],
              'runtime_commit':new['meta']['c2_main_sha_runtime'],
              'bdr_backfill':a,
          }
          Path('/tmp/monthly-artifact/monthly-functional-equivalence-2026-08.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Run territorial coverage and August Calvi diagnostic when applicable
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
          python scripts/audit_monthly_territorial_coverage.py \
            --month "$MONTH" \
            --c2-data data.json \
            --output "/tmp/monthly-artifact/monthly-territorial-coverage-$MONTH-audit.json" \
            --markdown "/tmp/monthly-artifact/monthly-territorial-coverage-$MONTH-audit.md"
          cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
          rm -rf outputs/ufip outputs/c1
          if [ "$MONTH" = '2026-08' ]; then
            cp config/bdr_station_brands.json /tmp/monthly-bdr-registry.json
            python scripts/audit_epci_monthly.py \
              --month "$MONTH" --epci-siren 242020105 --fuel SP95 \
              --c2-data data.json \
              --output "/tmp/monthly-artifact/calvi-balagne-sp95-$MONTH-audit.json" \
              --markdown "/tmp/monthly-artifact/calvi-balagne-sp95-$MONTH-audit.md"
            cp /tmp/monthly-bdr-registry.json config/bdr_station_brands.json
            rm -rf outputs/ufip outputs/c1
          fi

      - name: Exercise the widget generically in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly-web /tmp/monthly-widget-tools
          mkdir -p /tmp/monthly-web/widgets/bilan-territorial /tmp/monthly-web/outputs /tmp/monthly-widget-tools
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/FredericP555/carburantscorse2/${PROTOTYPE_REF}/widgets/bilan-territorial/index.html" \
            -o /tmp/monthly-web/widgets/bilan-territorial/index.html
          cp "/tmp/monthly-artifact/monthly-territories-$MONTH.json" "/tmp/monthly-web/outputs/monthly-territories-$MONTH.json"
          cat > /tmp/monthly-widget-tools/browser_smoke_generic.mjs <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { chromium } from 'playwright-core';
          function arg(name, fallback=null){ const i=process.argv.indexOf(name); return i>=0&&i+1<process.argv.length?process.argv[i+1]:fallback; }
          function check(cond,msg){ if(!cond) throw new Error(msg); }
          function browserPath(){
            for(const p of ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']) if(fs.existsSync(p)) return p;
            for(const cmd of ['google-chrome','google-chrome-stable','chromium','chromium-browser']){ try{return execFileSync('which',[cmd],{encoding:'utf8'}).trim();}catch{} }
            throw new Error('No Chrome/Chromium executable found on runner');
          }
          const url=arg('--url'); const output=arg('--output'); const expectedMonth=arg('--month');
          check(url&&output&&/^\d{4}-(0[1-9]|1[0-2])$/.test(expectedMonth||''),'--url, --output and canonical --month are required');
          const widgetUrl=new URL(url); const dataParam=widgetUrl.searchParams.get('data'); check(dataParam,'data query parameter required');
          const datasetUrl=new URL(dataParam,widgetUrl).href;
          const sha256=b=>createHash('sha256').update(b).digest('hex');
          const executablePath=browserPath();
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox','--disable-dev-shm-usage']});
          const report={schema:'a4c-monthly-widget-browser-smoke-v3',url,dataset_url:datasetUrl,browser:await browser.version(),executablePath,tests:{}};
          let expectedSha=null;
          async function noOverflow(page,label){ const x=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth})); check(x.scrollWidth<=x.innerWidth+1,`${label}: horizontal overflow`); return x; }
          async function load(page,mode){
            const responsePromise=page.waitForResponse(r=>r.url()===datasetUrl,{timeout:15000});
            await page.goto(url,{waitUntil:'networkidle'}); const response=await responsePromise; check(response.ok(),`${mode}: dataset HTTP ${response.status()}`);
            const bytes=await response.body(); const hash=sha256(bytes); const data=JSON.parse(bytes.toString('utf8'));
            check(data?.meta?.month===expectedMonth,`${mode}: dataset month ${data?.meta?.month} != ${expectedMonth}`);
            check(data?.meta?.epci_count_registry===19,`${mode}: registry must contain 19 EPCI`);
            if(expectedSha===null) expectedSha=hash; check(hash===expectedSha,`${mode}: dataset bytes changed between contexts`);
            await page.waitForSelector('#app:not([hidden])',{timeout:15000});
            check((await page.locator('#error').innerText()).trim()==='',`${mode}: error panel not empty`);
            check((await page.locator('#period').innerText()).includes(expectedMonth.slice(0,4)),`${mode}: period does not show expected year`);
            return {hash,overflow:await noOverflow(page,mode)};
          }
          async function exercise(page,mode){
            const out={};
            for(const fuel of ['Gazole','SP95']){
              await page.click(`[data-fuel="${fuel}"]`);
              const opts=await page.locator('#epci option').evaluateAll(es=>es.map(e=>({value:e.value,label:e.textContent||''})));
              check(opts.length===19,`${mode}/${fuel}: expected 19 EPCI, got ${opts.length}`);
              let limited=0;
              for(const o of opts){
                await page.selectOption('#epci',o.value);
                for(const id of ['mean','change','vsCorse','range','sample']){
                  const t=await page.locator(`#${id}`).innerText(); check(!t.includes('NaN')&&!t.includes('undefined'),`${mode}/${fuel}/${o.label}: invalid ${id}`);
                }
                const sample=await page.locator('#sample').innerText(); check(sample.includes('station-jours')&&sample.includes('couverture temporelle'),`${mode}/${fuel}/${o.label}: incomplete sample note`);
                check(await page.locator('#localities tr').count()>0,`${mode}/${fuel}/${o.label}: locality table empty`);
                if(await page.locator('#limited').isVisible()) limited++;
                await noOverflow(page,`${mode}/${fuel}/${o.label}`);
              }
              out[fuel]={epciTested:opts.length,horsClassement:limited};
            }
            return out;
          }
          async function dynamicInteractions(page,mode){
            await page.click('[data-fuel="SP95"]');
            const vals=await page.locator('#epci option').evaluateAll(es=>es.map(e=>e.value)); check(vals.length>=2,`${mode}: not enough EPCI for comparison`);
            await page.selectOption('#compareA',vals[0]); await page.selectOption('#compareB',vals[1]);
            const compare=await page.locator('#compareResult').innerText(); check(compare.trim()!==''&&!compare.includes('NaN'),`${mode}: comparison invalid`);
            await page.fill('#litres','70'); const network=await page.locator('#calcResult').innerText(); check(network.includes('70 L')&&!network.includes('NaN'),`${mode}: calculator invalid`);
            await page.selectOption('#bdrScope','all'); const all=await page.locator('#calcResult').innerText(); check(all.includes('70 L')&&!all.includes('NaN'),`${mode}: all-scope calculator invalid`);
            return {compare,network,all};
          }
          {
            const context=await browser.newContext({viewport:{width:1365,height:900},locale:'fr-FR'}); const page=await context.newPage(); const base=await load(page,'desktop');
            const layout=await page.evaluate(()=>({cards:getComputedStyle(document.querySelector('.cards')).gridTemplateColumns.split(' ').filter(Boolean).length,controls:getComputedStyle(document.querySelector('.controls')).gridTemplateColumns.split(' ').filter(Boolean).length}));
            check(layout.cards===4&&layout.controls===2,'desktop: unexpected grid layout');
            const exhaustive=await exercise(page,'desktop'); const interactions=await dynamicInteractions(page,'desktop');
            report.tests.desktop={ok:true,datasetSha256:base.hash,datasetMonth:expectedMonth,overflow:base.overflow,layout,exhaustive,interactions}; await context.close();
          }
          {
            const context=await browser.newContext({viewport:{width:390,height:844},locale:'fr-FR',isMobile:true}); const page=await context.newPage(); const base=await load(page,'mobile');
            const layout=await page.evaluate(()=>({cards:getComputedStyle(document.querySelector('.cards')).gridTemplateColumns.split(' ').filter(Boolean).length,controls:getComputedStyle(document.querySelector('.controls')).gridTemplateColumns.split(' ').filter(Boolean).length,buttonHeights:[...document.querySelectorAll('.fuel-buttons button')].map(e=>e.getBoundingClientRect().height)}));
            check(layout.cards===1&&layout.controls===1,'mobile: unexpected grid layout'); check(layout.buttonHeights.every(h=>h>=44),'mobile: touch target below 44px');
            const exhaustive=await exercise(page,'mobile'); const interactions=await dynamicInteractions(page,'mobile'); await noOverflow(page,'mobile final');
            report.tests.mobile={ok:true,datasetSha256:base.hash,datasetMonth:expectedMonth,overflow:base.overflow,layout,exhaustive,interactions}; await context.close();
          }
          await browser.close(); report.dataset_sha256=expectedSha; report.dataset_month=expectedMonth; report.ok=true;
          fs.mkdirSync(output.slice(0,output.lastIndexOf('/'))||'.',{recursive:true}); fs.writeFileSync(output,JSON.stringify(report,null,2)+'\n'); console.log(JSON.stringify(report,null,2));
          JS
          cd /tmp/monthly-widget-tools
          npm install --no-save --no-package-lock playwright-core@1.55.0 >/dev/null
          cd /tmp/monthly-web
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/monthly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/widgets/bilan-territorial/index.html >/dev/null; then break; fi
            sleep 0.5
          done
          node /tmp/monthly-widget-tools/browser_smoke_generic.mjs \
            --month "$MONTH" \
            --url "http://127.0.0.1:8765/widgets/bilan-territorial/index.html?data=/outputs/monthly-territories-$MONTH.json" \
            --output "/tmp/monthly-artifact/monthly-widget-browser-smoke-$MONTH.json"
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Create and re-check an ephemeral final receipt
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/monthly-run
          RECEIPT="/tmp/monthly-final-receipts/$MONTH.json"
          common=(
            --month "$MONTH"
            --dataset "/tmp/monthly-artifact/monthly-territories-$MONTH.json"
            --readiness "/tmp/monthly-artifact/monthly-readiness-$MONTH.json"
            --source-guards "/tmp/monthly-artifact/monthly-source-guards-$MONTH.json"
            --browser-smoke "/tmp/monthly-artifact/monthly-widget-browser-smoke-$MONTH.json"
            --widget /tmp/monthly-web/widgets/bilan-territorial/index.html
            --geography config/corse_station_geography_2026.csv
            --c2-business-receipt /tmp/c2-business/c2-business-success.json
            --output "$RECEIPT"
          )
          python scripts/write_monthly_receipt.py "${common[@]}"
          test -s "$RECEIPT"
          if python scripts/write_monthly_receipt.py "${common[@]}"; then
            echo 'Second receipt write unexpectedly succeeded' >&2
            exit 1
          fi
          cp "$RECEIPT" "/tmp/monthly-artifact/ephemeral-final-receipt-$MONTH.json"

      - name: Write dry-run manifest
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('/tmp/monthly-artifact')
          files={}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
              'schema':'a4c-monthly-main-dry-run-v3',
              'status':'success',
              'month':os.environ['MONTH'],
              'trigger_event':os.environ.get('TRIGGER_EVENT'),
              'run_sha':os.environ.get('RUN_SHA'),
              'c2_main_sha':os.environ.get('C2_MAIN_SHA'),
              'c2_business_success_run_id':os.environ.get('BUSINESS_RUN_ID'),
              'publication':'none',
              'repository_write':'none',
              'wordpress':'untouched',
              'final_receipt_location':'ephemeral Actions artifact only',
              'files_sha256':files,
          }
          (root/'dry-run-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload dry-run evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monthly-territorial-dry-run-${{ needs.prepare.outputs.month }}
          path: /tmp/monthly-artifact
          if-no-files-found: warn
          retention-days: 90
