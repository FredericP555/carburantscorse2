name: Audit H02 SP95 2026-08-24

on:
  push:
    branches:
      - audit/h02-sp95-20260824
    paths:
      - 'audit/h02_sp95_20260824.py'
      - '.github/workflows/audit-h02-sp95-20260824.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Recompute the four frozen SP95 points against historical and current C1 releases
        run: python audit/h02_sp95_20260824.py
