name: Audit H-02 SP95 2026-08-24

on:
  push:
    branches: [audit/final-three-hypotheses]
    paths:
      - tests/audit_h02_sp95_20260824.py
      - .github/workflows/audit-h02-sp95-20260824.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Recompute old/current Aug 24 SP95 gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/audit_h02_sp95_20260824.py
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h02-sp95-20260824-audit
          path: outputs/audit-h02/result.json
          retention-days: 14
