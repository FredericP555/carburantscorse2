name: Activate C2 V2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_activate-c2-v2-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real C2 weekly production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-weekly.yml --repo "$GITHUB_REPOSITORY" --ref main
